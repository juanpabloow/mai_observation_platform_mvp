openapi: 3.1.0
info:
  title: MT_AI Scheduling API (n8n)
  version: "1.2.0"
  description: >
    Machine API for the MT_AI scheduling engine. Bearer-token authenticated,
    reusing the existing per-tenant handoff token (Authorization: Bearer <token>).

    SCOPE — two headers together decide what a request may touch:
      • Authorization: Bearer <token>  → the TENANT + n8n connection (from the token).
      • X-Workflow-Ref: <n8n workflow id>  → REQUIRED on every endpoint. It is resolved
        to the workflow synced under that connection, and that workflow's owning CLIENT
        is the only client the request can read/modify. The client must be a non-default
        client with the `scheduling` module enabled.
    tenant_id and client_id are NEVER sent by the caller — both are derived server-side.
    A missing X-Workflow-Ref is 400; an unknown/foreign workflow is 404; a workflow whose
    client is the default ("Unassigned") client or has scheduling disabled is 403.

    Times are ISO-8601 timestamps in UTC — the canonical value to pass back when booking.
    v1.2 (C-6, ADDITIVE): availability slots and appointment objects also carry
    display-only local fields (start_local/end_local/start_label/end_label/date_label/day)
    formatted in the site's timezone by default, tunable per request with the `tz` and
    `locale` query params (an invalid `tz`/`locale` is 400, never a silent UTC fallback).
    UTC fields are unchanged, so existing consumers are unaffected. Double-booking is
    impossible at the database level (a Postgres GiST exclusion constraint); a lost race —
    or a slot taken since the availability read — returns 409.
servers:
  - url: https://YOUR-APP.up.railway.app/api/scheduling/v1
    description: Railway deployment (replace host)
  - url: http://localhost:3000/api/scheduling/v1
    description: Local dev
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The per-tenant handoff token (hk_...), issued in the platform.
  parameters:
    WorkflowRef:
      name: X-Workflow-Ref
      in: header
      required: true
      schema: { type: string }
      description: >
        The n8n workflow id (in n8n, `{{ $workflow.id }}`). Resolves the CLIENT this
        request acts on. Required on every endpoint; missing/blank → 400.
    Tz:
      name: tz
      in: query
      required: false
      schema: { type: string }
      description: >
        C-6, PRESENTATION ONLY. IANA timezone for the *_local/*_label fields (e.g.
        America/Mexico_City). Default: the site's own timezone. An unknown IANA name →
        400 invalid_request naming `tz` (never a silent UTC fallback). Does not change
        what is stored, available, or computed.
    Locale:
      name: locale
      in: query
      required: false
      schema: { type: string, default: es-CO }
      description: >
        C-6, PRESENTATION ONLY. BCP-47 locale for the label text (default es-CO,
        12-hour a. m./p. m.). An unsupported locale → 400 naming `locale`.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    LocalTimeFields:
      type: object
      description: >
        C-6 additive, DISPLAY-ONLY local-time fields (formatted in the `tz`/`locale` of
        the request; `tz` defaults to the site's timezone). `start_at`/`service_end_at`
        stay UTC and remain the canonical value to pass back when booking.
      properties:
        start_local: { type: string, description: "ISO-8601 with local offset, e.g. 2026-08-05T08:00:00-05:00" }
        end_local: { type: string }
        start_label: { type: string, description: "Short spoken 12-hour time, e.g. es-CO \"8:00 a. m.\"" }
        end_label: { type: string }
        date_label: { type: string, description: "Spoken local date, e.g. \"miércoles, 5 de agosto\"" }
        day: { type: string, description: "LOCAL calendar date YYYY-MM-DD (can differ from the UTC date near midnight)" }
    Slot:
      type: object
      allOf:
        - $ref: "#/components/schemas/LocalTimeFields"
      properties:
        start_at: { type: string, format: date-time, description: Canonical UTC; pass back verbatim to book. }
        service_end_at: { type: string, format: date-time, description: For the chosen staff (duration can differ per staff). }
        staff_id: { type: string, format: uuid, description: Deterministically chosen staff for "any". }
        available_staff_ids:
          type: array
          items: { type: string, format: uuid }
        candidates:
          type: array
          description: Per-staff service windows for this start (each staff's own duration).
          items:
            type: object
            properties:
              staff_id: { type: string, format: uuid }
              service_end_at: { type: string, format: date-time }
    Appointment:
      type: object
      allOf:
        - $ref: "#/components/schemas/LocalTimeFields"
      properties:
        id: { type: string, format: uuid }
        public_reference: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        staff_id: { type: string, format: uuid }
        service_id: { type: string, format: uuid }
        contact_id: { type: [string, "null"], format: uuid }
        contact:
          description: >
            C-7 (additive): who the appointment is for. `null` for a walk-in.
            `primary_identity` is the contact's main phone (else email).
          oneOf:
            - type: "null"
            - type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: [string, "null"] }
                primary_identity: { type: [string, "null"] }
        source_conversation_id: { type: [string, "null"], format: uuid }
        start_at: { type: string, format: date-time }
        service_end_at: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, confirmed, completed, cancelled, no_show] }
        origin: { type: string, enum: [public, n8n, internal, walk_in] }
        service_name: { type: string }
        duration_min: { type: integer }
        price: { type: [string, "null"] }
        version: { type: integer }
  responses:
    Unauthorized:
      description: >
        Missing/invalid/revoked Bearer token — `{ error: { code: "unauthorized" } }`.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: >
        Missing X-Workflow-Ref (`workflow_ref_required`); an unrecognized query
        param (`unknown_parameter`) or one sent with an empty value
        (`empty_parameter`); a MALFORMED id (not a UUID), unknown status value,
        non-boolean `active`, or bad `from`/`to` (`invalid_request`). A malformed id
        is always a 400 — never a 404 and never a silent empty result.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: >
        The workflow's client is the default client, or its `scheduling` module is
        disabled — `{ error: { code: "module_disabled" } }`.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: >
        AUTH-stage (indistinguishable): an unknown/foreign/wrong-connection
        X-Workflow-Ref → `not_found` "Workflow not found." RESOURCE-stage (specific,
        actionable — the caller already has this client's data, so naming the missing
        resource leaks nothing): `site_not_found` · `service_not_found` ·
        `staff_not_found` · `contact_not_found` · `appointment_not_found`. The message
        names the endpoint to call for valid ids. A foreign id is indistinguishable
        from a nonexistent one (same `*_not_found`). A well-formed but fabricated id
        NEVER returns an empty success — it returns the matching `*_not_found`.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: >
        `site_inactive` — the site exists but is deactivated (distinct from
        `site_not_found`; reactivate it or use another site_id). Booking conflicts:
        slot taken (`conflict_slot`), no longer available (`unavailable`), no staff
        (`no_staff`), idempotency-key reuse with a different payload
        (`conflict_idempotency`), or an illegal state transition (`invalid_transition`).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
paths:
  /sites:
    get:
      summary: List the resolved client's active sites
      parameters:
        - { $ref: "#/components/parameters/WorkflowRef" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sites: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /services:
    get:
      summary: List services enabled at a site
      parameters:
        - { $ref: "#/components/parameters/WorkflowRef" }
        - { name: site_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /staff:
    get:
      summary: List staff at a site (optionally filtered to a service)
      parameters:
        - { $ref: "#/components/parameters/WorkflowRef" }
        - { name: site_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: service_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /availability:
    get:
      summary: Real availability for a service in a window
      parameters:
        - { $ref: "#/components/parameters/WorkflowRef" }
        - { name: site_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: service_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: staff_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time }, description: "Window; max 45 days from `from`." }
        - { $ref: "#/components/parameters/Tz" }
        - { $ref: "#/components/parameters/Locale" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  site:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      timezone: { type: string, description: The site's own IANA timezone. }
                      timezone_used: { type: string, description: "The tz the *_local/*_label fields were formatted in (differs from `timezone` only when `tz` was passed)." }
                  slots: { type: array, items: { $ref: "#/components/schemas/Slot" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /appointments:
    get:
      summary: List appointments (safe filters; the resolved client only)
      description: >
        C-7: filters only NARROW within the token's one client. A filter is never
        silently ignored — an unrecognized param → `400 unknown_parameter`; a
        recognized param sent empty → `400 empty_parameter`. Identity filters
        (`phone`/`email`/`external_id`) resolve to that contact's appointments; an
        identity matching nobody returns 0 rows (never the whole client) and excludes
        walk-ins. `status` accepts one-or-more values (comma-separated/repeated);
        `active=true` is shorthand for scheduled+confirmed.
      parameters:
        - { $ref: "#/components/parameters/WorkflowRef" }
        - { name: site_id, in: query, schema: { type: string, format: uuid } }
        - { name: staff_id, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          description: One or more statuses, comma-separated and/or the param repeated.
          schema: { type: array, items: { type: string, enum: [scheduled, confirmed, completed, cancelled, no_show] } }
        - { name: active, in: query, description: "true → scheduled+confirmed (convenience).", schema: { type: boolean } }
        - { name: contact_id, in: query, schema: { type: string, format: uuid } }
        - { name: phone, in: query, description: "Resolve via the identity spine → that contact's appointments.", schema: { type: string } }
        - { name: email, in: query, description: "Resolve via the identity spine → that contact's appointments.", schema: { type: string } }
        - { name: external_id, in: query, description: "Resolve via the identity spine → that contact's appointments.", schema: { type: string } }
        - { name: conversation_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Tz" }
        - { $ref: "#/components/parameters/Locale" }
      responses:
        "200": { description: "OK — { appointments: [Appointment] }, each with UTC + local fields (per-row site tz unless `tz` was passed) and a contact object." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create an appointment (idempotent)
      parameters:
        - { $ref: "#/components/parameters/WorkflowRef" }
        - { $ref: "#/components/parameters/Tz" }
        - { $ref: "#/components/parameters/Locale" }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
          description: Per-tenant idempotency key. Same key+payload → the same appointment (200); reuse with a different payload → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, service_id, start_at]
              description: >
                The workflow (and thus client) comes from the X-Workflow-Ref HEADER, never
                the body. Sending a contact identity (channel + channel_user_id) attaches
                the appointment to a CRM contact (resolve-or-create); omit them for an
                anonymous booking (contact_id stays null).
              properties:
                conversation_ref: { type: string }
                channel: { type: string, description: "e.g. whatsapp — with channel_user_id, attaches a contact" }
                channel_user_id: { type: string, description: "wa_id or stable channel id" }
                customer_name: { type: string }
                customer_phone: { type: string, description: normalized to E.164 when possible }
                customer_email: { type: string }
                site_id: { type: string, format: uuid }
                service_id: { type: string, format: uuid }
                staff_id: { type: string, format: uuid, description: omit for "any barber" }
                start_at: { type: string, format: date-time }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { appointment: { $ref: "#/components/schemas/Appointment" } } } } } }
        "200": { description: Idempotent replay (same key+payload) — returns the existing appointment }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: Invalid body }
  /appointments/{id}/cancel:
    post:
      summary: Cancel (status change; never a physical delete)
      parameters:
        - { $ref: "#/components/parameters/WorkflowRef" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /appointments/{id}/confirm:
    post:
      summary: Confirm
      parameters:
        - { $ref: "#/components/parameters/WorkflowRef" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /appointments/{id}/complete:
    post:
      summary: Mark completed
      parameters:
        - { $ref: "#/components/parameters/WorkflowRef" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /appointments/{id}/no-show:
    post:
      summary: Mark no-show
      parameters:
        - { $ref: "#/components/parameters/WorkflowRef" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /appointments/{id}/reschedule:
    post:
      summary: Reschedule (keeps the same id; re-validates availability)
      parameters:
        - { $ref: "#/components/parameters/WorkflowRef" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_at]
              properties:
                start_at: { type: string, format: date-time }
                staff_id: { type: string, format: uuid }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: Invalid body }
